<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
(function () {
  try {
    var t = localStorage.getItem("app-theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
<style>
:root { --page-bg: #ffffff; --page-ink: #111111; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page-bg: #10171d; --page-ink: #e6ecf1; color-scheme: dark; }
}
:root[data-theme="dark"] { --page-bg: #10171d; --page-ink: #e6ecf1; color-scheme: dark; }

body {
  font-family: "Lato", sans-serif;
  background: var(--page-bg);
  color: var(--page-ink);
  transition: background 0.3s, color 0.3s;
}

.theme-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: calc(100% - 40px);
  margin: 24px 20px 0;
  padding: 10px 12px;
  background: transparent;
  border: 1px solid #444;
  border-radius: 8px;
  color: #c9c9c9;
  font-size: 18px;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
}
.theme-toggle:hover { color: #f1f1f1; border-color: #818181; }
.tt-track { position: relative; flex: none; width: 40px; height: 22px; border-radius: 999px; background: #444; transition: background 0.2s; }
.tt-track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #f1f1f1; transition: transform 0.2s; }
.theme-toggle[aria-checked="true"] .tt-track { background: #5cc1d6; }
.theme-toggle[aria-checked="true"] .tt-track::after { transform: translateX(18px); }

.sidenav {
  height: 100%;
  width: 0;
  position: fixed;
  z-index: 1;
  top: 0;
  left: 0;
  background-color: #111;
  overflow-x: hidden;
  transition: 0.5s;
  padding-top: 60px;
}

.sidenav a {
  padding: 8px 8px 8px 32px;
  text-decoration: none;
  font-size: 25px;
  color: #818181;
  display: block;
  transition: 0.3s;
}

.sidenav a:hover {
  color: #f1f1f1;
}

.sidenav .closebtn {
  position: absolute;
  top: 0;
  right: 25px;
  font-size: 36px;
  margin-left: 50px;
}

@media screen and (max-height: 450px) {
  .sidenav {padding-top: 15px;}
  .sidenav a {font-size: 18px;}
}
</style>
</head>
<body>

<div id="mySidenav" class="sidenav">
  <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
  <a href="fundamental_anylitical_tool.html">Fundamental Anylisis Tool</a>
  <a href="future_hedging_tool.html">Future Hedging Tool</a>
  <a href="option-buying.html">Option Buying Hedging Tool</a>
  <a href="option-selling.html">Option Selling Hedging Tool</a>

  <button class="theme-toggle" id="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Dark mode">
    <span id="theme-toggle-text">Dark mode</span>
    <span class="tt-track" aria-hidden="true"></span>
  </button>
</div>


<span style="font-size:30px;cursor:pointer" onclick="openNav()">&#9776; Open</span>

<script>
function openNav() {
  document.getElementById("mySidenav").style.width = "250px";
}

function closeNav() {
  document.getElementById("mySidenav").style.width = "0";
}

(function () {
  var root = document.documentElement;
  var btn = document.getElementById("theme-toggle");
  var txt = document.getElementById("theme-toggle-text");
  var mq = window.matchMedia("(prefers-color-scheme: dark)");

  function current() {
    return root.getAttribute("data-theme") || (mq.matches ? "dark" : "light");
  }
  function render() {
    var dark = current() === "dark";
    btn.setAttribute("aria-checked", String(dark));
    txt.textContent = dark ? "Light mode" : "Dark mode";
  }
  btn.addEventListener("click", function () {
    var next = current() === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("app-theme", next); } catch (e) {}
    render();
  });
  render();
})();
</script>

</body>
</html>
